name: CI Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fetch Arc
        run: git clone --depth=1 --branch=master https://github.com/Anuken/Arc ../Arc

      - name: Cache Gradle
        uses: gradle/gradle-build-action@v2

      - name: Build
        run: ./gradlew desktop:dist

      - name: Test
        run: ./gradlew tests:test

      - name: Quality analysis (JaCoCo coverage)
        run: ./gradlew jacocoTestReport --stacktrace

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: |
            tests/build/reports/jacoco/
            tests/build/reports/tests/test/
          if-no-files-found: warn

      - name: Update coverage on external Pages repo
        run: |
          TOKEN="${{ secrets.PROJECT_PAT }}"
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.API_TOKEN_GITHUB }}"
          fi
          if [ -z "$TOKEN" ]; then
            TOKEN="${{ secrets.GITHUB_TOKEN }}"
          fi
          
          git config --global user.email "actions@github.com"
          git config --global user.name "Github Actions"
          
          git clone https://x-access-token:${TOKEN}@github.com/psmindustry/psmindustry.git ../psmindustry
          mkdir -p ../psmindustry/coverage-report
          rm -rf ../psmindustry/coverage-report/*
          cp -r tests/build/reports/jacoco/test/html/* ../psmindustry/coverage-report/
          
          cd ../psmindustry
          git add .
          git commit -m "Update coverage report from CI run #${{ github.run_number }}" || true
          git push origin main || true